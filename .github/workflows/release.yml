name: Release

# Builds signed Android APKs for this fork and publishes a GitHub release.
#
# Signing reuses the fork's existing keystore secrets, so every release keeps
# the same certificate as the previous builds:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
#
# The tag must equal the pubspec versionName (v1.5.0 for `version: 1.5.0+78`).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match pubspec versionName, e.g. v1.5.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          app_version="${pubspec_version%%+*}"
          version_code="${pubspec_version##*+}"
          if [[ -z "${app_version}" || -z "${version_code}" || "${app_version}" == "${version_code}" ]]; then
            echo "::error::pubspec.yaml must use versionName+versionCode (got '${pubspec_version}')."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          expected="v${app_version}"
          if [[ "${tag}" != "${expected}" ]]; then
            echo "::error::Tag '${tag}' must equal pubspec versionName '${expected}'."
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "version=${app_version}"
            echo "version_code=${version_code}"
          } >> "${GITHUB_OUTPUT}"

  android:
    name: Build signed APKs
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=2

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 must be set to produce a signed APK."
            exit 1
          fi
          for name in ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} must be set when ANDROID_KEYSTORE_BASE64 is set."
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
          } > android/key.properties

      - name: Build APKs
        run: flutter build apk --release --flavor full --split-per-abi

      - name: Collect APKs
        id: apks
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          out="build/app/outputs/flutter-apk"
          files=()
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="${out}/app-${abi}-full-release.apk"
            [[ -f "${src}" ]] || src="${out}/app-${abi}-release.apk"
            if [[ ! -f "${src}" ]]; then
              echo "::error::Missing APK for ${abi} in ${out}"
              ls -la "${out}" || true
              exit 1
            fi
            dst="${out}/conduit-${VERSION}-${abi}.apk"
            cp "${src}" "${dst}"
            files+=("${dst}")
          done
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${files[@]}"

      - name: Verify signature
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "${APKSIGNER}" verify --print-certs \
            "build/app/outputs/flutter-apk/conduit-${VERSION}-arm64-v8a.apk" | tee certs.txt
          grep -q "CN=Z2549" certs.txt || echo "::warning::Certificate subject is not the expected CN=Z2549."

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          FILES: ${{ steps.apks.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "${FILES}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; replacing assets."
          else
            gh release create "${TAG}" \
              --title "Conduit ${TAG}" \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --latest
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber
